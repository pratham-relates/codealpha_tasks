<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator</title>
    
    <!-- Google Fonts for typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    
    <style>
        /* Base Reset & Typography */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Minimal Card Layout */
        .quote-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            text-align: center;
            transition: transform 0.3s ease;
        }

        /* Quote Text Styling */
        .quote-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            line-height: 1.4;
            color: #111827;
            margin-bottom: 20px;
            min-height: 80px; /* Prevents button jump on short/long quotes */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .quote-text::before {
            content: '"';
            color: #9ca3af;
        }
        
        .quote-text::after {
            content: '"';
            color: #9ca3af;
        }

        /* Author Text Styling */
        .quote-author {
            font-size: 1rem;
            font-weight: 600;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .quote-author::before {
            content: '— ';
        }

        /* Button Styling */
        .new-quote-btn {
            background-color: #111827;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .new-quote-btn:hover {
            background-color: #374151;
        }

        .new-quote-btn:active {
            transform: scale(0.97);
        }

        /* Fade Animation for text changes */
        .fade-in {
            animation: fadeIn 0.5s ease-in forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="quote-card">
        <div id="quoteContainer" class="fade-in">
            <h2 id="quote" class="quote-text">Loading quote...</h2>
            <p id="author" class="quote-author">Loading author</p>
        </div>
        <button id="newQuoteBtn" class="new-quote-btn">New Quote</button>
    </div>

    <script>
        // Array of quote objects
        const quotes = [
            { text: "The only way to do great work is to love what you do.", author: "Steve Jobs" },
            { text: "Life is what happens when you're busy making other plans.", author: "John Lennon" },
            { text: "The future belongs to those who believe in the beauty of their dreams.", author: "Eleanor Roosevelt" },
            { text: "It is during our darkest moments that we must focus to see the light.", author: "Aristotle" },
            { text: "Do not go where the path may lead, go instead where there is no path and leave a trail.", author: "Ralph Waldo Emerson" },
            { text: "In the end, it's not the years in your life that count. It's the life in your years.", author: "Abraham Lincoln" },
            { text: "You miss 100% of the shots you don't take.", author: "Wayne Gretzky" },
            { text: "Whether you think you can or you think you can't, you're right.", author: "Henry Ford" },
            { text: "I have learned over the years that when one's mind is made up, this diminishes fear.", author: "Rosa Parks" },
            { text: "I can't change the direction of the wind, but I can adjust my sails to always reach my destination.", author: "Jimmy Dean" }
        ];

        // DOM Elements
        const quoteTextElement = document.getElementById('quote');
        const authorTextElement = document.getElementById('author');
        const newQuoteBtn = document.getElementById('newQuoteBtn');
        const quoteContainer = document.getElementById('quoteContainer');

        let currentQuoteIndex = -1;

        // Function to generate and display a random quote
        function displayRandomQuote() {
            let randomIndex;
            
            // Ensure the new quote is different from the current one
            do {
                randomIndex = Math.floor(Math.random() * quotes.length);
            } while (randomIndex === currentQuoteIndex);

            currentQuoteIndex = randomIndex;
            const selectedQuote = quotes[randomIndex];

            // Re-trigger CSS fade animation
            quoteContainer.classList.remove('fade-in');
            
            // Use setTimeout to allow the DOM to register the class removal before adding it back
            setTimeout(() => {
                quoteTextElement.textContent = selectedQuote.text;
                authorTextElement.textContent = selectedQuote.author;
                quoteContainer.classList.add('fade-in');
            }, 50);
        }

        // Event Listeners
        newQuoteBtn.addEventListener('click', displayRandomQuote);

        // Display a quote immediately when the app loads
        window.addEventListener('DOMContentLoaded', displayRandomQuote);
    </script>
</body>
</html>

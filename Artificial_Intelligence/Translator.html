<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Translator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Base Reset & Variables */
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: var(--text-main);
            font-size: 1.8rem;
        }

        /* Layout for Translation Boxes */
        .wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .wrapper { grid-template-columns: 1fr; }
        }

        .box {
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #f9fafb;
        }

        /* Controls: Select & Buttons */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid var(--border);
            background: var(--card-bg);
        }

        select {
            border: none;
            outline: none;
            font-size: 0.95rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            background: transparent;
            cursor: pointer;
        }

        .icon-group {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            border-radius: 4px;
            padding: 4px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            color: var(--primary);
            background: #e0e7ff;
        }

        .icon-btn svg { width: 20px; height: 20px; fill: currentColor; }

        /* Text Areas */
        textarea {
            flex-grow: 1;
            min-height: 200px;
            border: none;
            outline: none;
            padding: 15px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            resize: none;
            background: transparent;
            color: var(--text-main);
            line-height: 1.5;
        }

        /* Main Translate Button */
        .translate-btn {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 1.1rem;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .translate-btn:hover { background-color: var(--primary-hover); }
        .translate-btn:disabled { background-color: #a5b4fc; cursor: not-allowed; }

        /* Status Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text-main);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Translation Tool</h1>

        <div class="wrapper">
            <!-- Source Input Box -->
            <div class="box">
                <div class="controls">
                    <select id="source-lang">
                        <!-- Common languages configured here -->
                        <option value="en-GB">English</option>
                        <option value="es-ES">Spanish</option>
                        <option value="fr-FR">French</option>
                        <option value="de-DE">German</option>
                        <option value="it-IT">Italian</option>
                        <option value="hi-IN">Hindi</option>
                        <option value="zh-CN">Chinese (Simplified)</option>
                        <option value="ja-JP">Japanese</option>
                        <option value="pt-PT">Portuguese</option>
                        <option value="ru-RU">Russian</option>
                    </select>
                    <div class="icon-group">
                        <button class="icon-btn" id="src-tts" title="Listen">
                            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                        </button>
                        <button class="icon-btn" id="src-copy" title="Copy">
                            <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                        </button>
                    </div>
                </div>
                <textarea id="source-text" placeholder="Type text here to translate..."></textarea>
            </div>

            <!-- Target Output Box -->
            <div class="box">
                <div class="controls">
                    <select id="target-lang">
                        <option value="es-ES">Spanish</option>
                        <option value="en-GB">English</option>
                        <option value="fr-FR">French</option>
                        <option value="de-DE">German</option>
                        <option value="it-IT">Italian</option>
                        <option value="hi-IN">Hindi</option>
                        <option value="zh-CN">Chinese (Simplified)</option>
                        <option value="ja-JP">Japanese</option>
                        <option value="pt-PT">Portuguese</option>
                        <option value="ru-RU">Russian</option>
                    </select>
                    <div class="icon-group">
                        <button class="icon-btn" id="tgt-tts" title="Listen">
                            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                        </button>
                        <button class="icon-btn" id="tgt-copy" title="Copy">
                            <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                        </button>
                    </div>
                </div>
                <textarea id="target-text" placeholder="Translation will appear here..." readonly></textarea>
            </div>
        </div>

        <button class="translate-btn" id="translate-btn">Translate Text</button>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast">Copied to clipboard!</div>

    <script>
        // DOM Elements
        const sourceText = document.getElementById('source-text');
        const targetText = document.getElementById('target-text');
        const sourceLang = document.getElementById('source-lang');
        const targetLang = document.getElementById('target-lang');
        const translateBtn = document.getElementById('translate-btn');
        const toast = document.getElementById('toast');

        // Copy functionality using Clipboard API
        document.getElementById('src-copy').addEventListener('click', () => copyToClipboard(sourceText.value));
        document.getElementById('tgt-copy').addEventListener('click', () => copyToClipboard(targetText.value));

        function copyToClipboard(text) {
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            });
        }

        // Text-to-Speech functionality using Web Speech API
        document.getElementById('src-tts').addEventListener('click', () => speakText(sourceText.value, sourceLang.value));
        document.getElementById('tgt-tts').addEventListener('click', () => speakText(targetText.value, targetLang.value));

        function speakText(text, lang) {
            if (!text) return;
            // Stop any ongoing speech
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            window.speechSynthesis.speak(utterance);
        }

        // Translation Function using MyMemory free API
        async function translate() {
            let text = sourceText.value.trim();
            if (!text) return;

            let translateFrom = sourceLang.value;
            let translateTo = targetLang.value;

            // UI Loading state
            translateBtn.disabled = true;
            translateBtn.innerText = "Translating...";
            targetText.value = "Translating...";

            // API Endpoint (Free, no key required, limits to 500 words/day)
            let apiUrl = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${translateFrom}|${translateTo}`;

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();
                
                if(data.responseData.translatedText) {
                    targetText.value = data.responseData.translatedText;
                } else {
                    targetText.value = "Error: Could not translate.";
                }
            } catch (error) {
                targetText.value = "Error: Network issue.";
                console.error("Translation error:", error);
            } finally {
                // Restore UI state
                translateBtn.disabled = false;
                translateBtn.innerText = "Translate Text";
            }
        }

        // Trigger translation on button click
        translateBtn.addEventListener('click', translate);

        // Swap languages easily by preventing same source/target (Optional enhancement logic)
        sourceLang.addEventListener('change', () => {
            if (sourceLang.value === targetLang.value) {
                // If user sets source to current target, swap them
                let temp = targetLang.value;
                targetLang.value = targetLang.options[(targetLang.selectedIndex + 1) % targetLang.options.length].value;
            }
        });
    </script>
</body>
</html>
